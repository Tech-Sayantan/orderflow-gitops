apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderflow-data
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tech-Sayantan/orderflow-gitops.git
    targetRevision: main
    path: platform/data
    directory: {}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
